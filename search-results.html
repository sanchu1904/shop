<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results - Food Delivery</title>
    <style>
        body {
            margin: 0;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', sans-serif;
            background-image: url(https://files.123freevectors.com/wp-content/original/118533-abstract-red-and-white-blur-lights-background-image.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 4rem;
            background: rgba(255, 255, 255, 0.15);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: inline-block;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .result-container {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
        }

        .food-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 300px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .food-card:hover {
            transform: scale(1.05);
        }

        .food-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .food-caption {
            font-size: 1.5rem;
            padding: 15px;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
        }

        .btn {
            margin-top: 40px;
            background: linear-gradient(145deg, #ff4d4d, #b30000);
            padding: 15px 25px;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,0,0,0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255,0,0,0.6);
        }

        .no-result {
            font-size: 2rem;
            margin-top: 50px;
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <h1>Search Results</h1>

    <div id="result-container" class="result-container"></div>

    <button class="btn" onclick="window.location.href='index.html'">Back to Home</button>

    <script>
        const menu = [
            { name: "Chicken Biriyani", image: "chicken.avif", price: 150 },
            { name: "Chicken Chilli", image: "chicken-65-.jpg", price: 120 },
            { name: "Beef Biriyani", image: "beefb.jpg", price: 180 },
            { name: "Beef Chilli", image: "beef-chilli.jpeg", price: 160 }
        ];

        let params = new URLSearchParams(window.location.search);
        let item = params.get("item")?.toLowerCase();

        let container = document.getElementById("result-container");

        let results = menu.filter(food => food.name.toLowerCase().includes(item));

        if(results.length > 0) {
            results.forEach(food => {
                let card = document.createElement("div");
                card.className = "food-card";
                card.innerHTML = `
                    <img src="${food.image}" alt="${food.name}">
                    <div class="food-caption">${food.name}</div>
                `;
                card.onclick = () => {
                    window.location.href = `order.html?name=${encodeURIComponent(food.name)}&image=${encodeURIComponent(food.image)}&price=${food.price}`;
                };
                container.appendChild(card);
            });
        } else {
            container.innerHTML = `<div class="no-result">No results found for "${item}"</div>`;
        }
    </script>

</body>
</html>
